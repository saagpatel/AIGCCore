name: quality-gates

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    name: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/diff-cover.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Waivers live in pnpm-workspace.yaml (auditConfig) with an owner and expiry.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      # rustup reads the channel and components from rust-toolchain.toml.
      - name: Setup pinned Rust
        run: rustup show active-toolchain

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust
        run: cargo test --workspace --locked

      - name: Policy checks
        run: node scripts/ci/require-tests-and-docs.mjs

      - name: Verify commands
        run: bash .codex/scripts/run_verify_commands.sh

      - name: Check build leaves tracked files unchanged
        run: git diff --exit-code

      - name: Run integration gates
        run: pnpm gate:all

      - name: Generate unit test coverage
        run: pnpm test:unit:coverage

      - name: Diff coverage
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/diff-cover.txt
          COMPARE_BRANCH=origin/main
          if ! git rev-parse --verify "$COMPARE_BRANCH" >/dev/null 2>&1; then
            COMPARE_BRANCH=origin/master
          fi
          diff-cover coverage/lcov.info --compare-branch="$COMPARE_BRANCH" --fail-under=90

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-artifacts
          path: |
            playwright-report/
            test-results/
            coverage/
