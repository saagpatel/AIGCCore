[package]
name = "aigc_core_tauri"
version = "0.1.0"
description = "AIGC Core desktop shell"
edition = "2021"
license = "MIT"

[[bin]]
name = "aigc_core_tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
aigc_core = { path = "../core" }
time = { version = "0.3.36", features = ["formatting"] }
sha2 = "0.11.0"
hex = "0.4.3"
log = "0.4.29"

[features]
default = []
authority-integrity-test-hooks = []

[dev-dependencies]
tauri = { version = "2.12.3", features = ["test"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
