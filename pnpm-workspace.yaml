packages:
  - "."

# Allow the wave 5 pinned releases inside pnpm's age window; remove each once it ages out.
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.71.2'
  - '@typescript-eslint/parser@8.71.2'
  - '@typescript-eslint/project-service@8.71.2'
  - '@typescript-eslint/scope-manager@8.71.2'
  - '@typescript-eslint/tsconfig-utils@8.71.2'
  - '@typescript-eslint/type-utils@8.71.2'
  - '@typescript-eslint/types@8.71.2'
  - '@typescript-eslint/typescript-estree@8.71.2'
  - '@typescript-eslint/utils@8.71.2'
  - '@typescript-eslint/visitor-keys@8.71.2'
  - '@vitest/coverage-v8@5.0.4'
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'
  - vitest@5.0.4

overrides:
  "@babel/core": 7.29.6
  "@opentelemetry/core": 2.8.0
  ajv@<6.14.0: 6.14.0
  basic-ftp: 6.2.1
  body-parser: 1.20.6
  brace-expansion@<1.1.18: 1.1.21
  brace-expansion@>=4.0.0 <5.0.9: 5.0.12
  browserslist: 4.28.7
  esbuild@<=0.24.2: 0.25.0
  express: 4.22.2
  fast-uri: 4.1.5
  ip-address: 10.7.1
  js-yaml: 5.4.1
  lodash: 4.18.1
  lodash-es: 4.18.1
  minimatch@<3.1.3: 3.1.4
  minimatch@>=9.0.0 <9.0.7: 9.0.7
  nanoid: 3.3.18
  path-to-regexp: 0.1.13
  postcss: 8.5.25
  proxy-agent: 8.0.2
  "@puppeteer/browsers": 3.2.1
  qs: 6.16.0
  rollup@>=4.0.0 <4.59.0: 4.59.0
  tmp: 0.2.7
  uuid: 14.0.1
  ws: 8.21.0
  yaml: 2.8.3
  # Keep source-map parsing on its patched release; remove when consumers require >=1.2.2.
  source-map-js: 1.2.2
  # Keep compression on its patched release; remove when consumers require >=1.8.2.
  compression: 1.8.2
  # Keep proxy address validation on its patched release; remove when consumers require >=2.0.8.
  proxy-addr: 2.0.8
  # Keep colord on a compatible current release; remove when consumers resolve it directly.
  colord: 2.10.0
