packages:
  - "."

# Allow the wave 5 pinned releases inside pnpm's age window; remove each once it ages out.
minimumReleaseAgeExclude:
  - "@typescript-eslint/eslint-plugin@8.71.2"
  - "@typescript-eslint/parser@8.71.2"
  - "@typescript-eslint/project-service@8.71.2"
  - "@typescript-eslint/scope-manager@8.71.2"
  - "@typescript-eslint/tsconfig-utils@8.71.2"
  - "@typescript-eslint/type-utils@8.71.2"
  - "@typescript-eslint/types@8.71.2"
  - "@typescript-eslint/typescript-estree@8.71.2"
  - "@typescript-eslint/utils@8.71.2"
  - "@typescript-eslint/visitor-keys@8.71.2"
  - "@vitest/coverage-v8@5.0.4"
  - "@vitest/mocker@5.0.4"
  - "@vitest/spy@5.0.4"
  - vitest@5.0.4

# Every override below is verified against pnpm-lock.yaml: "Forces" entries change
# the resolved version if deleted and re-locked; "Guard" entries already match the
# lockfile and only stop a fresh resolve from picking an older release.
overrides:
  # Held at 7.29.6; re-locking without it resolves 7.29.7. Remove once 7.29.7 or later is verified here.
  "@babel/core": 7.29.6
  # Guard: keep ajv 6.x on its patched release. Remove when consumers require >=6.14.0.
  ajv@<6.14.0: 6.14.0
  # Forces the patched release; consumers otherwise resolve 5.3.1. Remove when every consumer requires >=6.2.1.
  basic-ftp: 6.2.1
  # Held at 1.20.6; re-locking without it resolves 1.20.8. Remove once 1.20.8 or later is verified here.
  body-parser: 1.20.6
  # Guard: keep brace-expansion 1.x on its patched release. Remove when consumers require >=1.1.18.
  brace-expansion@<1.1.18: 1.1.21
  # Guard: keep brace-expansion 5.x on its patched release. Remove when consumers require >=5.0.9.
  brace-expansion@>=4.0.0 <5.0.9: 5.0.12
  # Held at 4.28.7; re-locking without it resolves 4.29.3. Remove once 4.29.3 or later is verified here.
  browserslist: 4.28.7
  # Held at 4.22.2; re-locking without it resolves 4.22.3. Remove once 4.22.3 or later is verified here.
  express: 4.22.2
  # Forces the patched release; consumers otherwise resolve 3.1.8. Remove when every consumer requires >=4.1.5.
  fast-uri: 4.1.5
  # Held at 10.7.1; re-locking without it resolves 10.7.4. Remove once 10.7.4 or later is verified here.
  ip-address: 10.7.1
  # Forces the patched release; consumers otherwise resolve 3.15.2 and 4.3.2. Remove when every consumer requires >=5.4.1.
  js-yaml: 5.4.1
  # Guard: lodash is already on the patched release. Remove when consumers require >=4.18.1.
  lodash: 4.18.1
  # Guard: lodash-es is already on the patched release. Remove when consumers require >=4.18.1.
  lodash-es: 4.18.1
  # Guard: keep minimatch 3.x on its patched release. Remove when consumers require >=3.1.3.
  minimatch@<3.1.3: 3.1.4
  # Guard: keep minimatch 9.x on its patched release. Remove when consumers require >=9.0.7.
  minimatch@>=9.0.0 <9.0.7: 9.0.7
  # Held at 3.3.18; re-locking without it resolves 3.3.20. Remove once 3.3.20 or later is verified here.
  nanoid: 3.3.18
  # Guard: path-to-regexp 0.1.x is already on its patched release. Remove when consumers require >=0.1.13.
  path-to-regexp: 0.1.13
  # Held at 8.5.25; re-locking without it resolves 8.5.29. Remove once 8.5.29 or later is verified here.
  postcss: 8.5.25
  # Forces the current release; consumers otherwise resolve 6.5.0. Remove when every consumer requires >=8.0.2.
  proxy-agent: 8.0.2
  # Forces the current release; consumers otherwise resolve 2.13.2. Remove when every consumer requires >=3.2.1.
  "@puppeteer/browsers": 3.2.1
  # Forces the patched release; consumers otherwise resolve 6.15.3. Remove when every consumer requires >=6.16.0.
  qs: 6.16.0
  # Forces the patched release; consumers otherwise resolve 0.0.33 and 0.1.0. Remove when every consumer requires >=0.2.7.
  tmp: 0.2.7
  # Forces the patched release; consumers otherwise resolve 8.3.2. Remove when every consumer requires >=14.0.1.
  uuid: 14.0.1
  # Forces the patched release; consumers otherwise resolve 7.5.13. Remove when every consumer requires >=8.21.0.
  ws: 8.21.0
  # Held at 2.8.3; re-locking without it resolves 2.9.1. Remove once 2.9.1 or later is verified here.
  yaml: 2.8.3
  # Guard: keep source-map parsing on its patched release. Remove when consumers require >=1.2.2.
  source-map-js: 1.2.2
  # Guard: keep compression on its patched release. Remove when consumers require >=1.8.2.
  compression: 1.8.2
  # Guard: keep proxy address validation on its patched release. Remove when consumers require >=2.0.8.
  proxy-addr: 2.0.8
  # Guard: keep colord on a compatible current release. Remove when consumers resolve it directly.
  colord: 2.10.0
